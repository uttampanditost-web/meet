    <script>
      // Completely neutralize WebSocket connection attempts to rely exclusively on
      // Server-Sent Events (SSE), HTTP Long Polling, WebRTC signaling, and MQTT messaging.
      (function() {
        class MockWebSocket {
          constructor(url, protocols) {
            this.url = url;
            this.readyState = 3; // CLOSED
            this.bufferedAmount = 0;
            this.extensions = '';
            this.protocol = '';
            this.binaryType = 'blob';
            this.onopen = null;
            this.onmessage = null;
            this.onerror = null;
            this.onclose = null;
          }
          send() {}
          close() {}
          addEventListener() {}
          removeEventListener() {}
          dispatchEvent() { return true; }
        }
        MockWebSocket.CONNECTING = 0;
        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSING = 2;
        MockWebSocket.CLOSED = 3;

        try {
          Object.defineProperty(window, 'WebSocket', {
            value: MockWebSocket,
            writable: false,
            configurable: true
          });
        } catch (e) {
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
